<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regusto Restaurante · Peça online</title>
<meta name="description" content="Marmitas, marmitex, grelhados e self-service por quilo. Av. Getúlio Vargas, 16-70, Bauru.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="Regusto Restaurante · Peça online">
<meta property="og:description" content="Marmitas, marmitex, grelhados e self-service por quilo. Av. Getúlio Vargas, 16-70, Bauru.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ef;--card:#fff;--txt:#141414;--sub:#6f6a62;--linha:#e7e1d7;
  --preto:#111;--ouro:#e3a12f;--ouro-esc:#b97d14;--terra:#d9774f;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0f;--card:#1a1a1a;--txt:#f3efe8;--sub:#a39d93;--linha:#2a2a2a}}
:root[data-theme="dark"]{--bg:#0f0f0f;--card:#1a1a1a;--txt:#f3efe8;--sub:#a39d93;--linha:#2a2a2a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* hero: o letreiro */
.hero{background:var(--preto);color:#fff;padding:56px 0 64px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--terra)}
.marca{font:700 clamp(54px,11vw,104px)/1 var(--serif);color:var(--ouro);margin:0;letter-spacing:-.01em}
.marca span{display:inline-block;opacity:0;transform:translateY(40%);animation:letra .8s cubic-bezier(.2,.7,.2,1) forwards}
.sub-marca{font:500 13px var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--ouro);margin:6px 0 0 4px;opacity:0;animation:sobe .8s .7s forwards}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px;opacity:0;animation:sobe .8s .9s forwards}
.tag{font:500 13px var(--sans);color:#d8d2c7;border:1px solid #333;padding:6px 12px;border-radius:999px}
.estado{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--sans);color:#fff;background:#1d1d1d;padding:6px 12px;border-radius:999px}
.estado i{width:7px;height:7px;border-radius:50%;background:#888}.estado.on i{background:#5fcf73}
@keyframes letra{to{opacity:1;transform:none}}
@keyframes sobe{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* abas de categoria */
.abas{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--linha);padding-top:env(safe-area-inset-top,0px)}
.abas .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;position:relative}
.abas .wrap::-webkit-scrollbar{display:none}
.aba{white-space:nowrap;padding:16px 12px;font:500 14px var(--sans);color:var(--sub);transition:color .2s}
.aba.on{color:var(--txt)}
.indicador{position:absolute;bottom:0;height:2px;background:var(--ouro);transition:left .3s,width .3s}

/* cardápio */
main{padding-bottom:120px}
.cat{padding:40px 0 8px}
.cat h2{font:700 28px/1.1 var(--serif);margin:0 0 4px}
.cat p.desc{color:var(--sub);margin:0 0 18px;font-size:14px}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.item{display:flex;justify-content:space-between;gap:16px;text-align:left;background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:18px;transition:transform .2s,border-color .2s}
.item:hover{transform:translateY(-2px);border-color:var(--ouro)}
.item h3{font:600 16px var(--sans);margin:0 0 4px}
.item p{margin:0;color:var(--sub);font-size:14px}
.item .preco{margin-top:10px;font:600 15px var(--sans)}
.item .preco small{font-weight:400;color:var(--sub);font-size:12px;margin-right:4px}
.mais{flex:none;align-self:flex-end;width:36px;height:36px;border-radius:50%;background:var(--preto);color:var(--ouro);display:grid;place-items:center;font-size:20px;line-height:1}
.foto-item{position:relative;flex:none;width:84px;height:84px}
.foto-item img{width:84px;height:84px;border-radius:12px;object-fit:cover;display:block}
.foto-item .mais{position:absolute;right:-8px;bottom:-8px;align-self:auto}
.foto-prod{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;display:block;margin-bottom:14px}
.hoje{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:18px;margin-bottom:12px;font-size:14px}
.hoje b{font-weight:600}
.hoje .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--linha);border-radius:999px;padding:5px 11px;font-size:13px}
.revela{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s cubic-bezier(.2,.7,.2,1)}
.revela.vis{opacity:1;transform:none}

/* info */
.info{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.info div{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:18px;font-size:14px}
.info b{display:block;font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ouro-esc);margin-bottom:6px}

/* botão sacola */
.sacola-btn{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:30;display:flex;align-items:center;gap:14px;background:var(--preto);color:#fff;border-radius:999px;padding:14px 22px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .4s cubic-bezier(.2,.7,.2,1);width:min(92vw,420px);justify-content:space-between}
.sacola-btn.on{transform:translate(-50%,0)}
.sacola-btn .qtd{background:var(--ouro);color:#111;font-weight:600;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px}
.sacola-btn.pula{animation:pula .4s}
@keyframes pula{50%{transform:translate(-50%,0) scale(1.05)}}

/* folha (modal de baixo) */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.fundo.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.7,.2,1);padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.folha.on{transform:none}
.alca{width:40px;height:4px;border-radius:2px;background:var(--linha);margin:0 auto 16px}
.folha h3{font:700 24px var(--serif);margin:0 0 4px}
.folha .d{color:var(--sub);font-size:14px;margin:0 0 16px}
.grupo{border-top:1px solid var(--linha);padding:16px 0}
.grupo h4{font:600 14px var(--sans);margin:0 0 10px;display:flex;justify-content:space-between}
.grupo h4 small{color:var(--sub);font-weight:400}
.op{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px;cursor:pointer}
.op input{accent-color:var(--ouro-esc);width:18px;height:18px}
textarea,input[type=text],input[type=tel]{width:100%;border:1px solid var(--linha);background:var(--bg);color:var(--txt);border-radius:12px;padding:12px;font:inherit}
.rodape-folha{display:flex;gap:10px;margin-top:16px;align-items:center}
.qt{display:flex;align-items:center;border:1px solid var(--linha);border-radius:999px}
.qt button{width:40px;height:44px;font-size:18px}
.qt span{min-width:20px;text-align:center;font-weight:600}
.btn{flex:1;min-height:48px;border-radius:999px;background:var(--preto);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
.btn.ouro{background:var(--ouro);color:#111}
.linha-sac{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--linha);font-size:14px}
.linha-sac small{display:block;color:var(--sub)}
.rem{color:var(--sub);font-size:13px;text-decoration:underline}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:4px;margin-bottom:10px}
.seg button{flex:1;padding:10px;border-radius:999px;font-weight:500;font-size:14px}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.aviso{font-size:13px;color:var(--sub);margin:8px 0 0}
footer{text-align:center;color:var(--sub);font-size:13px;padding:30px 20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.marca span,.sub-marca,.tags,.revela{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <span class="estado" id="estado"><i></i><span>...</span></span>
    <h1 class="marca" id="marca" aria-label="Regusto">Regusto</h1>
    <p class="sub-marca">Restaurante</p>
    <div class="tags"><span class="tag">Self service por quilo</span><span class="tag">Marmitas</span><span class="tag">Marmitex</span><span class="tag">Grelhados</span></div>
  </div>
</header>

<nav class="abas" aria-label="Categorias"><div class="wrap" id="abas"><span class="indicador" id="ind"></span></div></nav>

<main class="wrap" id="menu"></main>

<footer>Regusto Restaurante · Av. Getúlio Vargas, 16-70, Bauru/SP · (14) 3204-4151</footer>

<button class="sacola-btn" id="sacolaBtn" aria-label="Abrir sacola"><span class="qtd" id="sacQtd">0</span><span>Ver sacola</span><strong id="sacTotal">R$ 0,00</strong></button>
<div class="fundo" id="fundo"></div>
<section class="folha" id="folha" role="dialog" aria-modal="true"></section>

<script>
/* ===== DADOS (conferir com o cardápio completo em regusto.com.br) ===== */
const WHATS="5511998731881";
const DO_DIA={principais:["Almôndegas ao sugo","Filé mignon suíno grelhado","Filé de frango à milanesa","Filé de frango grelhado","Strogonoff de frango","Bife bovino grelhado"],acomp:["Macarrão ao sugo","Farofa crocante","Purê de batata","Batata frita","Ovo frito"]};
const MENU=[
 {id:"marmitex",nome:"Marmitex",desc:"Arroz branco ou integral, feijão e as misturas do dia.",itens:[
   {n:"Marmitex normal",d:"Para 1 pessoa · até 2 misturas",p:30,apartir:1,mix:2,foto:"assets/fotos/marmitex-normal.webp"},
   {n:"Marmitex reforçada",d:"Para 1 pessoa com fome · até 3 misturas",p:34,apartir:1,mix:3},
   {n:"Marmitex especial",d:"Para 2 pessoas · até 4 misturas",p:48,apartir:1,mix:4}]},
 {id:"grelhados",nome:"Grelhados",desc:"Com arroz, feijão, batata frita e farofa.",itens:[
   {n:"Alcatra",d:"Acompanha ovo frito",p:38.9},
   {n:"Filé mignon suíno",d:"Grelhado na hora",p:33.9,foto:"assets/fotos/file-mignon-suino.webp"},
   {n:"Filé de frango à milanesa",d:"Empanado e sequinho",p:33.9,foto:"assets/fotos/file-frango-milanesa.webp"},
   {n:"Filé de frango grelhado",d:"Arroz branco ou integral",p:33.9}]},
 {id:"extras",nome:"Adicionais",desc:"Para completar o pedido.",itens:[
   {n:"Salada de folhas e tomate",d:"Porção individual",p:7},
   {n:"Pastel de carne",d:"",p:5},{n:"Pastel de queijo",d:"",p:5},{n:"Pastel de frango com catupiry",d:"",p:5}]},
 {id:"bebidas",nome:"Bebidas",desc:"Sucos naturais, água e refrigerantes.",itens:[
   {n:"Suco natural de laranja",d:"500 ml",p:14},{n:"Suco natural de limão",d:"500 ml",p:14},
   {n:"Água mineral",d:"500 ml · sem gás",p:4},{n:"Água mineral",d:"500 ml · com gás",p:4},
   {n:"Coca-Cola",d:"2 litros",p:15},{n:"Refrigerante",d:"600 ml",p:10},{n:"Refrigerante lata",d:"350 ml",p:6},
   {n:"H2O limão",d:"",p:6},{n:"H2O limoneto",d:"",p:6}]}
];
/* ===================================================================== */
const $=s=>document.querySelector(s),brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let sacola=[];

/* letras do letreiro */
$("#marca").innerHTML=[..."Regusto"].map((c,i)=>`<span style="animation-delay:${i*.06}s" aria-hidden="true">${c}</span>`).join("");

/* aberto/fechado */
function aberto(){const a=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Sao_Paulo"})),d=a.getDay(),m=a.getHours()*60+a.getMinutes();return d>=1&&d<=6&&m>=480&&m<860}
function estado(){const on=aberto();$("#estado").classList.toggle("on",on);$("#estado span").textContent=on?"Aberto agora · até 14h20":"Fechado · seg a sáb, 8h às 14h20"}
estado();setInterval(estado,60000);

/* monta o cardápio */
$("#abas").insertAdjacentHTML("beforeend",MENU.map(c=>`<button class="aba" data-alvo="${c.id}">${c.nome}</button>`).join(""));
$("#menu").innerHTML=MENU.map(c=>`<section class="cat" id="${c.id}"><h2 class="revela">${c.nome}</h2><p class="desc revela">${c.desc}</p>
 ${c.id==="marmitex"?`<div class="hoje revela"><b>Misturas de hoje</b><div class="chips">${DO_DIA.principais.map(x=>`<span class="chip">${x}</span>`).join("")}</div></div>`:""}
 <div class="lista">${c.itens.map((it,i)=>`<button class="item revela" style="transition-delay:${i*60}ms" data-c="${c.id}" data-i="${i}"><div><h3>${it.n}</h3>${it.d?`<p>${it.d}</p>`:""}<div class="preco">${it.apartir?"<small>a partir de</small>":""}${brl(it.p)}</div></div>${it.foto?`<div class="foto-item"><img src="${it.foto}" alt="${it.n}" loading="lazy"><span class="mais" aria-hidden="true">+</span></div>`:`<span class="mais" aria-hidden="true">+</span>`}</button>`).join("")}</div></section>`).join("")+
 `<section class="info"><div class="revela"><b>Endereço</b>Av. Getúlio Vargas, 16-70<br>Jd. América, Bauru/SP</div><div class="revela"><b>Horário</b>Segunda a sábado<br>8h às 14h20</div><div class="revela"><b>Pagamento</b>Pix, dinheiro, cartões e vale-refeição (Alelo, VR, Sodexo, Ticket)</div><div class="revela"><b>Contato</b><a href="tel:+551432044151">(14) 3204-4151</a><br><a href="https://wa.me/${WHATS}" target="_blank" rel="noopener">WhatsApp</a></div></section>`;

/* aparecer ao rolar */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("vis");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".revela").forEach(el=>io.observe(el));

/* abas + indicador que acompanha a rolagem */
const abas=[...document.querySelectorAll(".aba")];
function marca(id){abas.forEach(a=>{const on=a.dataset.alvo===id;a.classList.toggle("on",on);if(on){$("#ind").style.left=a.offsetLeft+"px";$("#ind").style.width=a.offsetWidth+"px";a.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})}})}
abas.forEach(a=>a.onclick=()=>document.getElementById(a.dataset.alvo).scrollIntoView());
const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)marca(e.target.id)}),{rootMargin:"-40% 0px -55% 0px"});
MENU.forEach(c=>io2.observe(document.getElementById(c.id)));marca(MENU[0].id);

/* folha */
const abrir=h=>{$("#folha").innerHTML='<div class="alca"></div>'+h;$("#folha").classList.add("on");$("#fundo").classList.add("on")};
const fechar=()=>{$("#folha").classList.remove("on");$("#fundo").classList.remove("on")};
$("#fundo").onclick=fechar;addEventListener("keydown",e=>e.key==="Escape"&&fechar());

/* produto */
document.addEventListener("click",e=>{const b=e.target.closest(".item");if(!b)return;
 const it=MENU.find(c=>c.id===b.dataset.c).itens[+b.dataset.i];let q=1;
 abrir(`${it.foto?`<img class="foto-prod" src="${it.foto}" alt="${it.n}" loading="lazy">`:""}<h3>${it.n}</h3><p class="d">${it.d||""}</p>
 ${it.mix?`<div class="grupo"><h4>Misturas <small>escolha até ${it.mix}</small></h4>${DO_DIA.principais.map(x=>`<label class="op"><input type="checkbox" name="mix" value="${x}">${x}</label>`).join("")}</div>`:""}
 ${it.mix||b.dataset.c==="grelhados"?`<div class="grupo"><h4>Arroz</h4><label class="op"><input type="radio" name="arroz" value="Arroz branco" checked>Branco</label><label class="op"><input type="radio" name="arroz" value="Arroz integral">Integral</label></div>`:""}
 <div class="grupo"><h4>Observação</h4><textarea id="obs" rows="2" placeholder="Ex.: sem cebola"></textarea></div>
 <div class="rodape-folha"><div class="qt"><button id="menos" aria-label="Menos">−</button><span id="q">1</span><button id="mais" aria-label="Mais">+</button></div><button class="btn ouro" id="add">Adicionar · <span id="st">${brl(it.p)}</span></button></div>`);
 const up=()=>{$("#q").textContent=q;$("#st").textContent=brl(it.p*q)};
 $("#menos").onclick=()=>{if(q>1){q--;up()}};$("#mais").onclick=()=>{q++;up()};
 $("#folha").querySelectorAll('input[name=mix]').forEach(c=>c.onchange=()=>{const m=[...$("#folha").querySelectorAll('input[name=mix]:checked')];if(m.length>it.mix)c.checked=false});
 $("#add").onclick=()=>{const mix=[...$("#folha").querySelectorAll('input[name=mix]:checked')].map(x=>x.value),arroz=$("#folha").querySelector('input[name=arroz]:checked')?.value,obs=$("#obs").value.trim();
   const det=[mix.length?mix.join(", "):"",arroz||"",obs?"Obs: "+obs:""].filter(Boolean).join(" · ");
   sacola.push({n:it.n,p:it.p,q,det});atualiza();fechar()};
});

/* sacola */
function atualiza(){const n=sacola.reduce((a,x)=>a+x.q,0),t=sacola.reduce((a,x)=>a+x.p*x.q,0);
 $("#sacQtd").textContent=n;$("#sacTotal").textContent=brl(t);const b=$("#sacolaBtn");b.classList.toggle("on",n>0);b.classList.remove("pula");void b.offsetWidth;b.classList.add("pula")}
let modo="Entrega";
$("#sacolaBtn").onclick=abreSacola;
function abreSacola(){const t=sacola.reduce((a,x)=>a+x.p*x.q,0);
 abrir(`<h3>Sua sacola</h3>${sacola.map((x,i)=>`<div class="linha-sac"><div>${x.q}× ${x.n}<small>${x.det}</small><button class="rem" data-r="${i}">remover</button></div><strong>${brl(x.p*x.q)}</strong></div>`).join("")}
 <div class="linha-sac"><span>Subtotal</span><strong>${brl(t)}</strong></div>
 <div class="grupo"><div class="seg"><button data-m="Entrega" class="${modo==="Entrega"?"on":""}">Entrega</button><button data-m="Retirada" class="${modo==="Retirada"?"on":""}">Retirar no local</button></div>
 <input type="text" id="nome" placeholder="Seu nome" autocomplete="name" style="margin-bottom:8px">
 ${modo==="Entrega"?`<input type="text" id="end" placeholder="Endereço completo" autocomplete="street-address" style="margin-bottom:8px">`:""}
 <select id="pag" style="width:100%;border:1px solid var(--linha);background:var(--bg);color:var(--txt);border-radius:12px;padding:12px;font:inherit"><option>Pix</option><option>Dinheiro</option><option>Cartão de crédito</option><option>Cartão de débito</option><option>Vale-refeição</option></select>
 ${modo==="Entrega"?'<p class="aviso">A taxa de entrega é confirmada pelo restaurante no WhatsApp.</p>':""}
 ${aberto()?"":'<p class="aviso">O restaurante está fechado agora. Seu pedido será respondido no próximo horário de atendimento.</p>'}</div>
 <div class="rodape-folha"><button class="btn ouro" id="enviar">Enviar pedido pelo WhatsApp</button></div>`);
 $("#folha").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{sacola.splice(+b.dataset.r,1);atualiza();sacola.length?abreSacola():fechar()});
 $("#folha").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{modo=b.dataset.m;abreSacola()});
 $("#enviar").onclick=()=>{const nome=$("#nome").value.trim(),end=$("#end")?.value.trim();
  if(!nome||(modo==="Entrega"&&!end)){($("#nome").value?$("#end"):$("#nome")).focus();return}
